<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand" href="#">Portfolio dev and test</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu" aria-controls="navmenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navmenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#experience">Experience</a></li>
                <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div id="app">
        <div class="d-flex justify-content-center py-5">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
        </div>
    </div>

    <!-- Server-side fallback for users without JavaScript -->
    <noscript>
        <div class="row gx-4">
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body text-center">
                        <h3 class="card-title" th:text="${profile.name}">Your Name</h3>
                        <p class="text-muted" th:text="${profile.headline}">Headline</p>
                        <p th:text="${profile.location}">Location</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5>Contact</h5>
                        <p><a th:href="${'mailto:' + profile.email}" th:text="${profile.email}">you@example.com</a></p>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <section id="about" class="mb-4">
                    <h4>About</h4>
                    <p th:text="${profile.summary}">Summary</p>
                </section>

                <section id="experience" class="mb-4">
                    <h4>Experience</h4>
                    <ul class="list-unstyled">
                        <li th:each="exp : ${profile.experiences}" class="mb-3">
                            <h6 th:text="${exp.title}">Title</h6>
                            <div class="text-muted" th:text="${exp.company} + ' • ' + ${exp.period}">Company • Period</div>
                            <p th:text="${exp.description}">Description</p>
                        </li>
                    </ul>
                </section>

                <section id="projects" class="mb-4">
                    <h4>Projects</h4>
                    <div th:each="pr : ${profile.projects}" class="card mb-3">
                        <div class="card-body">
                            <h6 class="card-title"><a th:href="${pr.url}" th:text="${pr.name}">Project</a></h6>
                            <p th:text="${pr.description}">Description</p>
                        </div>
                    </div>
                </section>

                <section id="skills" class="mb-4">
                    <h4>Skills</h4>
                    <div>
                        <span th:each="s : ${profile.skills}" class="badge bg-secondary me-1" th:text="${s.name}">Skill</span>
                    </div>
                </section>
            </div>
        </div>
    </noscript>
</main>

<script th:src="@{/app.js}"></script>
<!-- Bootstrap bundle for interactive components -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
